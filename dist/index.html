<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>社團搜尋自動化系統</title><meta name="description" content="輸入關鍵字後，自動搜尋社團並整理成可下載的表格。"/><link rel="stylesheet" href="./styles.css"/></head><body><main class="app-shell"><section class="hero card"><p class="eyebrow">Group Finder System</p><h1>社團搜尋自動化系統</h1><p class="lede">輸入任意關鍵字，自動比對多種社團主題、排序相關結果，並輸出成 Excel 可直接開啟的 CSV。</p></section><section class="controls card"><input id="keyword" placeholder="例如：親子、咖啡、投資、台中、攝影、二手" /><select id="platform"><option value="all">全部平台</option><option value="facebook">Facebook 社團</option><option value="discord">Discord 社群</option><option value="reddit">Reddit Community</option><option value="line">LINE 社群</option><option value="telegram">Telegram 群組</option></select><select id="region"><option value="all">全部地區</option><option value="tw">台灣</option><option value="hk">香港</option><option value="global">國際</option><option value="sea">東南亞</option></select><div class="actions"><button id="searchBtn" class="primary">開始搜尋</button><button id="downloadBtn" class="secondary" disabled>下載 CSV</button></div></section><section class="card results-panel"><div class="results-head"><div><p class="eyebrow">搜尋結果</p><h2 id="summaryTitle">尚未搜尋</h2></div><div class="results-meta"><div id="stats" class="stats">等待輸入關鍵字</div><div id="datasetStats" class="dataset-stats">0 筆資料</div></div></div><div class="table-wrap"><table><thead><tr><th>相關度</th><th>社團名稱</th><th>平台</th><th>地區</th><th>網址</th><th>標籤</th></tr></thead><tbody id="resultsBody"><tr><td colspan="6" class="empty">輸入關鍵字後按下「開始搜尋」</td></tr></tbody></table></div></section><section class="card import-panel"><textarea id="jsonInput" placeholder='貼上 JSON 陣列，例如 [{"name":"...","platform":"facebook",...}]'></textarea><div class="import-row"><input id="fileInput" type="file" accept=".json,application/json" /><button id="importBtn" class="secondary">匯入資料</button><button id="resetBtn" class="secondary">還原範例資料</button></div><div id="importStatus" class="import-status">目前使用內建範例資料。</div></section></main><script src="./script.js"></script></body></html>
