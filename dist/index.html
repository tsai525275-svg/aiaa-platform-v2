<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社團搜尋管理系統</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><style>html{scroll-behavior:smooth;scroll-padding-top:16px}body{font-family:Arial,"Microsoft JhengHei",sans-serif}.admin-table tbody tr:nth-child(even){background:#f8faf8}.admin-table td,.admin-table th{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb}@media(max-width:900px){.layout{display:block!important}.sidebar{width:100%!important;min-height:auto!important}.toolbar{grid-template-columns:1fr!important}}</style></head><body class="m-0 bg-white text-slate-700"><header id="system-top" class="flex h-16 items-center justify-between bg-lime-500 px-6 text-white shadow-sm"><div class="flex items-center gap-3"><div class="grid h-9 w-9 place-items-center rounded bg-white/20 font-black">GF</div><h1 class="text-xl font-black tracking-wide">社團搜尋管理系統</h1></div><div id="connection" class="rounded bg-white/15 px-4 py-2 text-sm font-bold">● 正在檢查擴充功能…</div></header><div class="layout grid min-h-[calc(100vh-64px)] grid-cols-[210px_minmax(0,1fr)]"><aside class="sidebar w-[210px] border-r border-slate-300 bg-slate-100"><div class="border-b border-slate-300 px-5 py-4 font-bold text-slate-600">☷ 搜尋功能</div><a id="navGroup" href="#search-panel" class="block w-full cursor-pointer border-l-4 border-lime-500 bg-white px-5 py-4 text-left font-bold text-lime-700 hover:bg-lime-50">▣ 社團搜尋</a><a id="navResults" href="#results-panel" class="block w-full cursor-pointer border-b border-slate-200 px-8 py-3 text-left text-sm text-slate-500 hover:bg-slate-200">搜尋結果</a><button id="navExcel" class="w-full border-b border-slate-200 px-8 py-3 text-left text-sm text-slate-500 hover:bg-slate-200">Excel 匯出</button></aside><main class="min-w-0 bg-white"><div class="flex h-14 items-center gap-2 border-b border-slate-200 px-5 text-sm"><span class="text-lime-600">⌂</span><span>首頁</span><span class="text-slate-400">›</span><strong class="text-lime-700">社團搜尋</strong></div><section id="search-panel" class="border-b border-slate-300 bg-slate-50 p-4"><div class="toolbar grid items-start gap-2 lg:grid-cols-[minmax(280px,1fr)_120px_130px_120px_140px]"><textarea id="keyword" rows="2" placeholder="每行輸入一個關鍵字" class="min-h-[42px] max-h-[150px] resize-y border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-lime-500"></textarea><input id="count" type="number" min="1" max="1000" value="100" aria-label="搜尋數量" class="h-[42px] border border-slate-300 bg-white px-3 outline-none focus:border-lime-500"><button id="search" class="h-[42px] bg-green-700 px-4 font-bold text-white hover:bg-green-800">開始搜尋</button><button id="reset" class="h-[42px] border border-slate-300 bg-white px-4 font-bold text-slate-600 hover:bg-slate-100">重新搜尋</button><button id="download" disabled class="h-[42px] bg-lime-600 px-4 font-bold text-white disabled:bg-slate-300">下載 Excel</button></div><p class="mt-2 text-xs text-slate-500">多個關鍵字請用逗號或換行分隔 · 每次翻頁間隔 12 秒 · 遇到真人驗證會保存進度</p></section><section id="results-panel"><div class="flex items-center justify-between border-b border-slate-300 px-5 py-3"><div><span class="mr-3 font-bold text-slate-700">搜尋結果</span><span id="title" class="text-sm text-slate-500">尚未搜尋</span></div><div id="status" class="text-sm font-bold text-green-700">可以開始搜尋</div></div><div class="overflow-auto"><table class="admin-table w-full min-w-[900px] border-collapse text-left text-sm"><thead class="bg-green-100 text-slate-600"><tr><th class="w-20 px-4 py-3 text-center">排名</th><th class="px-4 py-3">社團名稱</th><th class="w-[360px] px-4 py-3">網址</th><th class="w-52 px-4 py-3">搜尋關鍵字</th></tr></thead><tbody id="body"><tr><td colspan="4" class="px-4 py-20 text-center text-slate-400">等待搜尋資料</td></tr></tbody></table></div></section><footer class="border-t bg-slate-50 py-5 text-center text-xs text-slate-400">Group Finder Administration System</footer></main></div><script src="script.js?v=2.4.0"></script></body></html>
