<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社團搜尋擴充功能</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <h1>社團搜尋</h1>
      <label>
        關鍵字
        <textarea id="keywords" placeholder="越南房地產, Bất động sản Việt Nam"></textarea>
      </label>
      <label>
        目標數量
        <input id="count" type="number" min="1" max="1000" value="100" />
      </label>
      <button id="start">開始搜尋</button>
      <p id="status">等待輸入關鍵字</p>
      <pre id="output"></pre>
      <script src="popup.js"></script>
    </main>
  </body>
</html>
