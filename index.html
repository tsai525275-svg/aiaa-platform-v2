<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社團搜尋管理台</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><style>body{font-family:Inter,"Microsoft JhengHei",sans-serif}.panel{box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.05)}@media(max-width:1023px){aside{min-height:auto!important;position:static!important}}</style></head><body class="bg-slate-100 text-slate-900"><div class="min-h-screen lg:grid lg:grid-cols-[250px_minmax(0,1fr)]"><aside class="sticky top-0 min-h-screen bg-slate-950 p-5 text-white"><div class="flex items-center gap-3 border-b border-white/10 pb-6"><div class="grid h-11 w-11 place-items-center rounded-xl bg-blue-600 font-black">GF</div><div><div class="font-black">Group Finder</div><div class="text-xs text-slate-400">社團搜尋管理台</div></div></div><nav class="mt-7 grid gap-2 text-sm"><div class="rounded-xl bg-blue-600 px-4 py-3 font-bold">⌕　社團搜尋</div><div class="rounded-xl px-4 py-3 text-slate-400">▤　搜尋結果</div><div class="rounded-xl px-4 py-3 text-slate-400">⇩　Excel 匯出</div></nav><div class="mt-8 rounded-xl border border-white/10 bg-white/5 p-4"><p class="text-xs font-bold uppercase tracking-widest text-slate-500">Extension</p><div id="connection" class="mt-3 text-sm font-bold text-amber-300">● 正在檢查擴充功能…</div></div></aside><main class="min-w-0"><header class="border-b border-slate-200 bg-white px-6 py-5"><div class="mx-auto flex max-w-[1500px] items-center justify-between"><div><p class="text-sm font-semibold text-slate-500">工作台 / 社團搜尋</p><h1 class="mt-1 text-2xl font-black">社團搜尋管理</h1></div><span class="rounded-lg border bg-slate-50 px-3 py-2 text-sm font-bold text-slate-600">Chrome 擴充功能版</span></div></header><div class="mx-auto grid max-w-[1500px] gap-6 p-5 md:p-8"><section class="grid gap-4 sm:grid-cols-3"><div class="panel rounded-2xl border bg-white p-5"><p class="text-sm font-semibold text-slate-500">已找到社團</p><div class="mt-2 flex items-end justify-between"><strong id="statFound" class="text-3xl font-black">0</strong><span class="rounded-lg bg-blue-50 px-2 py-1 text-xs font-bold text-blue-700">RESULTS</span></div></div><div class="panel rounded-2xl border bg-white p-5"><p class="text-sm font-semibold text-slate-500">目標數量</p><div class="mt-2 flex items-end justify-between"><strong id="statTarget" class="text-3xl font-black">100</strong><span class="rounded-lg bg-violet-50 px-2 py-1 text-xs font-bold text-violet-700">TARGET</span></div></div><div class="panel rounded-2xl border bg-white p-5"><p class="text-sm font-semibold text-slate-500">搜尋模式</p><div class="mt-2 flex items-end justify-between"><strong class="text-xl font-black">低速穩定</strong><span class="rounded-lg bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-700">12 SEC</span></div></div></section><section class="panel rounded-2xl border bg-white"><div class="border-b px-6 py-5"><h2 class="text-lg font-black">建立搜尋工作</h2><p class="mt-1 text-sm text-slate-500">每行輸入一個關鍵字，系統會逐一搜尋並合併不重複的社團。</p></div><div class="grid items-start gap-3 p-6 xl:grid-cols-[minmax(320px,1fr)_140px_190px_160px_170px]"><textarea id="keyword" rows="2" placeholder="每行一個關鍵字，例如：&#10;越南房地產&#10;Bất động sản Việt Nam" class="min-h-[72px] max-h-[220px] resize-y rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50"></textarea><input id="count" type="number" min="1" max="1000" value="100" aria-label="搜尋數量" class="h-[72px] rounded-xl border border-slate-300 px-4 text-lg outline-none focus:border-blue-500"><button id="search" class="h-[72px] rounded-xl bg-blue-600 px-5 text-lg font-black text-white shadow-lg shadow-blue-600/20 hover:bg-blue-700">⌕ 開始搜尋</button><button id="reset" class="h-[72px] rounded-xl border border-slate-300 bg-white px-5 font-bold text-slate-700 hover:bg-slate-50">重新搜尋</button><button id="download" disabled class="h-[72px] rounded-xl bg-slate-900 px-5 font-bold text-white disabled:bg-slate-200 disabled:text-slate-400">下載 Excel</button></div></section><section class="panel overflow-hidden rounded-2xl border bg-white"><div class="flex flex-col gap-3 border-b px-6 py-5 md:flex-row md:items-center md:justify-between"><div><p class="text-xs font-black uppercase tracking-[.18em] text-blue-600">Search results</p><h2 id="title" class="mt-1 text-xl font-black">尚未搜尋</h2></div><div id="status" class="rounded-lg bg-slate-100 px-3 py-2 text-sm font-bold text-slate-600">請先確認擴充功能已連線</div></div><div class="overflow-auto"><table class="w-full min-w-[900px] text-left"><thead class="bg-slate-50 text-sm text-slate-500"><tr><th class="w-20 px-6 py-4">排名</th><th class="px-6 py-4">社團名稱</th><th class="w-[360px] px-6 py-4">網址</th><th class="w-52 px-6 py-4">搜尋關鍵字</th></tr></thead><tbody id="body"><tr><td colspan="4" class="px-6 py-20 text-center text-slate-400">等待建立搜尋工作</td></tr></tbody></table></div></section></div></main></div><script src="script.js?v=2.0.0"></script></body></html>
