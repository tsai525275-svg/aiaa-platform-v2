ter:hover{background:#5eae00;transform:translateY(-3px)}.enter:focus-visible{outline:4px solid rgba(255,255,255,.8);outline-offset:4px}@media(max-width:640px){.hero{padding-bottom:9vh;background-position:58% center}.brand{top:5vh}.mark{width:62px;height:62px;margin-bottom:13px;font-size:21px}.name{font-size:29px;letter-spacing:.1em}.tagline{margin-top:9px;font-size:12px;letter-spacing:.28em}.enter{min-width:190px;padding:16px 30px;font-size:19px}}</style></head><body><main class="hero"><div class="brand" aria-label="通衡科技"><div class="mark" aria-hidden="true"><span>TH</span></div><h1 class="name">通衡科技</h1><p class="tagline">TongBalance Technology</p></div><a class="enter" href="./system.html">進入系統</a></main></body></html>
